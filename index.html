<style>
:root{
  --paper:#FAF8F5; --card:#FFFFFF; --line:#E8E2D9; --line2:#F0EBE4;
  --ink:#2C2A29; --muted:#78736D; --accent:#1C5B3D; --accent-d:#14452E; --accent-soft:#EFF6F1;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.6;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header.top{position:sticky;top:0;z-index:5;background:rgba(250,248,245,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:17px;font-weight:700;letter-spacing:.04em;flex:1}
header.top h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 span.sub{font-weight:400;font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}
.row .l b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .l small{color:var(--muted);font-size:12px}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
body.hide .amt{filter:blur(7px)}
.neg{color:var(--red)} .pos{color:var(--accent)}
.big{font-size:26px;line-height:1.25}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.plain{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--card);color:var(--red);border-color:#E7B8B2}
.btn.s{white-space:nowrap;flex-shrink:0;min-height:40px;padding:4px 10px;font-size:13px;font-weight:500}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;min-width:44px;min-height:44px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;background:var(--line2);color:var(--muted);margin-left:4px;white-space:nowrap}
.tag.r{background:var(--red-soft);color:var(--red)} .tag.a{background:var(--amber-soft);color:var(--amber)} .tag.g{background:var(--accent-soft);color:var(--accent)}
.steps .st{padding:12px 0;border-bottom:1px dashed var(--line)}
.steps .st:last-child{border-bottom:0;padding-bottom:0}
.steps .st small{color:var(--muted);font-size:12.5px;display:block}
.bar{height:14px;border-radius:7px;background:var(--line2);overflow:hidden;display:flex;margin:4px 0 2px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;min-height:84px;cursor:pointer;text-align:center}
.quick button:active{background:var(--accent-soft)}
.quick button.ed{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.quick .ic{font-size:24px;display:block;line-height:1.2}
.quick small{display:block;color:var(--muted);font-size:12px}
.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--accent);margin-right:3px}
.dots i.f{background:var(--accent)} .dots i.o{background:var(--amber);border-color:var(--amber)}
textarea,input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
label.c{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
label.c input{width:20px;height:20px}
input[type=range]{width:100%}
/* 家計簿の上のまとめ */
.dash h3{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:700}
.dtop{border-radius:14px;padding:14px;background:var(--accent-soft)}
.dtop.sig-y{background:#FFF6E0}.dtop.sig-r{background:#FCEBEA}
.dtop small{display:block;color:var(--muted);font-size:12px}
.dbig{font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.5px;margin-right:10px}
.dsig{font-size:14px;font-weight:700;white-space:nowrap}
.dpace{margin:6px 0 8px;font-size:14px}.dpace b{font-size:16px}.dpace small{display:block;margin-top:2px}
.dtop .bar{position:relative;overflow:visible;background:#fff}.dtop .bar i{background:var(--accent);border-radius:7px}.dtop.sig-y .bar i{background:#D9A21B}.dtop.sig-r .bar i{background:var(--red)}.dtop .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.dflow{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.dline{display:flex;gap:0;min-width:max-content;position:relative}
.dline:before{content:"";position:absolute;left:14px;right:14px;top:9px;height:3px;background:var(--line);border-radius:2px}
.dline{display:grid;grid-template-columns:repeat(4,1fr);min-width:0}.dpt{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding-right:6px}
.dpt i{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin-bottom:4px;z-index:1}
.dpt.now i{background:var(--accent)}
.dpt b{font-size:13px;line-height:1.3}.dpt small{font-size:12px;color:var(--muted)}
.lnk{background:none;border:0;color:var(--accent);font-size:13px;padding:6px 0;cursor:pointer;text-decoration:underline}
.dcat{display:grid;gap:6px}
.dc{display:grid;grid-template-columns:28px 64px 1fr auto;align-items:center;gap:6px;font-size:14px}
.dc .ic{font-size:20px}.dc .cb{height:12px;background:var(--line2);border-radius:6px;overflow:hidden}.dc .cb i{display:block;height:100%;background:var(--accent);border-radius:6px}
.dc .ca{font-weight:700;min-width:52px;text-align:right}
.dweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.dw{display:flex;flex-direction:column;align-items:center;gap:2px}
.dw .wb{width:100%;height:56px;background:var(--line2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.dw .wb i{display:block;width:100%;background:var(--accent);border-radius:6px}
.dw.on small{font-weight:800;color:var(--accent)}.dw.fut{opacity:.45}
.ddue{display:grid;gap:6px}
.dd{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.dd .dn{font-size:13px}.dd .dn b{font-size:18px}.dd .da{font-weight:700}
body.hide .dash .dbig,body.hide .dash .ca,body.hide .dash .da,body.hide .dash .dpace b{filter:blur(7px)}
.dmore{margin-top:16px;border-top:1px solid var(--line2);padding-top:10px}
.dmore>summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-height:40px;color:var(--accent)}
.dmore>summary::-webkit-details-marker{display:none}.dmore>summary::after{content:"▾";margin-left:auto;color:var(--muted)}.dmore[open]>summary::after{content:"▴"}
.dmore>summary small{font-weight:400;color:var(--muted);font-size:12px}
.txc>summary .sub{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
#kb .kbtools>div{margin-top:16px;padding-top:12px;border-top:1px solid var(--line2)}#kb .kbtools>div:first-of-type{border-top:0;padding-top:0}
/* マネーフォワード風のまとめ */
.mfwrap{display:grid;gap:12px;margin-bottom:16px}
.mf{--p:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:var(--p)}
.mf h3{margin:0 0 12px;font-size:15px;font-weight:800;color:var(--ink)}
.mftop{background:var(--accent-soft);border-color:transparent}.mftop.sig-y{background:#FFF6E0}.mftop.sig-r{background:#FCEBEA}
.mfrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mfl{font-size:13px;color:var(--muted);font-weight:600}
.mftop .dbig{display:block;margin:2px 0 8px}
.mftop .bar{position:relative;overflow:visible;background:#fff}.mftop .bar i{background:var(--accent);border-radius:7px}.mftop.sig-y .bar i{background:#D9A21B}.mftop.sig-r .bar i{background:var(--red)}
.mftop .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.mfsm{font-size:13px;color:var(--muted);margin-top:6px}.mfsm b{font-size:15px}
.mfli{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line2);background:none;text-align:left;font:inherit;color:inherit;min-height:56px;cursor:default}
button.mfli{cursor:pointer}.mfli:first-of-type{border-top:0}.mfli.off{opacity:.5}
.mfic{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--line2)}
.mfic.due{border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:16px;flex-basis:48px;height:48px;flex-direction:column;line-height:1}.mfic.due small{font-size:10px;font-weight:600}
.mfn{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis}.mfn small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfn .new{font-style:normal;font-size:11px;background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.mfa{font-size:16px;font-weight:700;white-space:nowrap}.mfa small{font-size:11px;font-weight:400;margin-left:1px}
.mfday{font-size:12px;font-weight:700;color:var(--muted);background:var(--paper);margin:8px calc(-1*var(--p)) 0;padding:6px var(--p)}
.mfmore{width:100%;margin-top:8px;padding:12px;border:0;border-top:1px solid var(--line2);background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.mfpie{display:flex;align-items:center;gap:14px}
.donut{width:46%;max-width:180px;flex:0 0 auto}.donut .dl1{font-size:10px;fill:var(--muted)}.donut .dl2{font-size:17px;font-weight:800;fill:var(--ink)}
.mfleg{flex:1;display:grid;gap:6px;min-width:0}
.mfleg div{display:grid;grid-template-columns:10px 1fr auto;column-gap:6px;align-items:center;font-size:13px}
.mfleg i{width:10px;height:10px;border-radius:3px}.mfleg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mfleg b{font-size:14px}
.mfleg span small{color:var(--muted);font-size:11px;margin-left:4px}
.mfbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.mfbars>div{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.mfbars small{font-size:10px;color:var(--muted);white-space:nowrap}
.mfbars span{position:relative;width:70%;height:110px;display:flex;align-items:flex-end}
.mfbars span i{display:block;width:100%;background:#BFD8C9;border-radius:6px 6px 2px 2px}.mfbars .on span i{background:var(--accent)}
.mfbars span em{position:absolute;left:-15%;right:-15%;border-top:2px dashed var(--red);opacity:.6}
.mfbars b{font-size:12px;font-weight:600}.mfbars .on b{color:var(--accent);font-weight:800}
body.hide .mfwrap .dbig,body.hide .mfwrap .mfa,body.hide .mfwrap .mfleg b,body.hide .mfwrap .dl2,body.hide .mfwrap .mfsm b,body.hide .mfwrap .mfbars small{filter:blur(7px)}
